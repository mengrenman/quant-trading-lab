<!-- Market depth under the order book: cumulative visible lots from the mid outward (app/depth_chart.py) -->
<div id="depth-chart" class="bg-darkCard border border-darkBorder rounded-xl p-3 shadow-sm">
    <div class="flex items-baseline justify-between gap-2 text-[0.625rem] text-slate-400 mb-1 px-1">
        <span class="text-[0.6875rem] font-bold text-slate-100 uppercase tracking-wider">Market depth</span>
        {% if depth %}<span>cumulative lots within {{ depth.half_width }} ticks of the mid</span>{% endif %}
    </div>
    {% if depth %}
    <svg viewBox="0 0 {{ depth.width }} {{ depth.height }}" class="w-full h-auto" role="img"
         aria-label="Depth chart: {{ depth.bid_total }} lots bid and {{ depth.ask_total }} offered within {{ depth.half_width }} ticks of the mid">
        {% if depth.bid_area %}<path d="{{ depth.bid_area }}" class="fill-emerald-500/20"></path>
        <path d="{{ depth.bid_line }}" fill="none" stroke-width="1.5" stroke-linejoin="round" class="stroke-emerald-400"></path>{% endif %}
        {% if depth.ask_area %}<path d="{{ depth.ask_area }}" class="fill-rose-500/20"></path>
        <path d="{{ depth.ask_line }}" fill="none" stroke-width="1.5" stroke-linejoin="round" class="stroke-rose-400"></path>{% endif %}
        <line x1="4" y1="{{ depth.base }}" x2="{{ depth.width - 4 }}" y2="{{ depth.base }}" class="stroke-slate-700"></line>
        <line x1="{{ depth.mid_x }}" y1="12" x2="{{ depth.mid_x }}" y2="{{ depth.base }}" stroke-dasharray="3 3" class="stroke-cyan-500/60"></line>
        {% for o in depth.own %}<path d="M{{ o.x }} {{ depth.base + 1 }} l-3.5 5 h7 z" class="fill-cyan-300"><title>Your {{ "buy" if o.side == "bid" else "sell" }} orders at {{ o.price }}</title></path>{% endfor %}
        <text x="6" y="10" font-size="9" class="fill-slate-400">{{ "{:,}".format(depth.y_max) }} lots</text>
        <text x="4" y="{{ depth.height - 3 }}" font-size="9" class="fill-slate-400">{{ depth.lo_label }}</text>
        <text x="{{ depth.mid_x }}" y="{{ depth.height - 3 }}" font-size="9" text-anchor="middle" class="fill-cyan-300">mid {{ depth.mid|price }}</text>
        <text x="{{ depth.width - 4 }}" y="{{ depth.height - 3 }}" font-size="9" text-anchor="end" class="fill-slate-400">{{ depth.hi_label }}</text>
    </svg>
    {% else %}
    <p class="text-[0.6875rem] text-slate-500 italic px-1 py-2">The book is empty.</p>
    {% endif %}
</div>
