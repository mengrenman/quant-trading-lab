<!-- Matching engine toggle: the server switches engines and returns this button re-rendered -->
<button id="engine-toggle" type="button"
        hx-post="/api/engine" hx-target="this" hx-swap="outerHTML"
        title="Click to switch the matching priority rule"
        class="font-mono font-semibold px-2 py-0.5 rounded bg-slate-800 text-emerald-400 hover:text-emerald-300 transition cursor-pointer">
    {% if engine_type == "price_time" %}Price-Time (FIFO){% else %}Pro-Rata (Hybrid){% endif %}
</button>
