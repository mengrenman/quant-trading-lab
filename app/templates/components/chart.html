<!-- Real-Time Candlestick Chart & Volume Dual-Panel Component -->
<div id="chart-panel" class="flex flex-col">
    <!-- PANEL 1: Price Candlesticks Card -->
    <div class="bg-darkCard border border-darkBorder rounded-xl p-4 shadow-sm flex flex-col space-y-2">
        <!-- Candlestick Header & HUD Bar -->
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-darkBorder">
            <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                </svg>
                <h2 class="text-sm font-semibold text-slate-100 uppercase tracking-wider">Price Candlesticks (OHLC)</h2>
                <span id="chart-pulse" class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse" title="Live Streaming"></span>
            </div>

            <!-- Live OHLC HUD values -->
            <div id="chart-hud" class="flex items-center space-x-3 text-xs font-mono bg-slate-900/80 px-2.5 py-1 rounded-lg border border-slate-800">
                <div><span class="text-slate-500">O:</span> <span id="hud-o" class="text-slate-200 font-bold">—</span></div>
                <div><span class="text-slate-500">H:</span> <span id="hud-h" class="text-emerald-400 font-bold">—</span></div>
                <div><span class="text-slate-500">L:</span> <span id="hud-l" class="text-rose-400 font-bold">—</span></div>
                <div><span class="text-slate-500">C:</span> <span id="hud-c" class="text-cyan-400 font-bold">—</span></div>
                <div title="Volume-weighted average price of every trade this session"><span class="text-slate-500">VWAP:</span> <span id="hud-vwap" class="text-amber-400 font-bold">—</span></div>
            </div>

            <!-- Interval & View Controls -->
            <div class="flex items-center flex-wrap gap-1.5 text-xs">
                <span class="text-slate-400 mr-0.5 text-[11px] font-medium" title="Bar length in units of simulation time">Interval (sim time):</span>
                <div class="inline-flex rounded-lg bg-slate-950 p-0.5 border border-slate-800 gap-0.5">
                    <button type="button" onclick="setChartInterval(1)" id="btn-interval-1" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">1s</button>
                    <button type="button" onclick="setChartInterval(2)" id="btn-interval-2" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-cyan-300 font-semibold bg-slate-800 border border-cyan-800 shadow-sm cursor-pointer">2s</button>
                    <button type="button" onclick="setChartInterval(5)" id="btn-interval-5" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">5s</button>
                    <button type="button" onclick="setChartInterval(10)" id="btn-interval-10" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">10s</button>
                    <button type="button" onclick="setChartInterval(15)" id="btn-interval-15" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">15s</button>
                    <button type="button" onclick="setChartInterval(30)" id="btn-interval-30" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">30s</button>
                    <button type="button" onclick="setChartInterval(60)" id="btn-interval-60" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">1m</button>
                    <button type="button" onclick="setChartInterval(180)" id="btn-interval-180" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">3m</button>
                    <button type="button" onclick="setChartInterval(300)" id="btn-interval-300" class="px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer">5m</button>
                </div>
            </div>
        </div>

        <!-- Candlestick Chart Container -->
        <div id="price-chart-container" class="w-full h-[420px] rounded-lg overflow-hidden relative bg-darkBg">
            <div id="chart-loading" class="absolute inset-0 flex items-center justify-center bg-slate-950/60 z-20 text-xs text-slate-400">
                <div class="flex items-center space-x-2">
                    <svg class="animate-spin h-4 w-4 text-cyan-400" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                    <span>Loading Candlesticks...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- HORIZONTAL ZOOM TOOLBAR -->
    <div id="chart-controls-toolbar" class="my-2 px-3 py-2 bg-slate-900/90 border border-slate-800 rounded-lg flex flex-wrap items-center justify-between gap-y-2 gap-x-4 text-xs">
        <!-- Horizontal Zoom Group -->
        <div class="flex items-center flex-wrap gap-2.5">
            <div class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
                <span class="font-semibold text-slate-200 uppercase tracking-wide text-[11px]">Horizontal Zoom:</span>
                <span id="hzoom-val-badge" class="font-mono text-cyan-300 font-bold bg-slate-950 px-2 py-0.5 rounded border border-slate-700">100% (8.0px)</span>
            </div>

            <!-- Zoom Steppers & Continuous Slider -->
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="zoomChart(-1)" title="Zoom Out" class="w-5 h-5 flex items-center justify-center rounded text-slate-400 hover:text-slate-50 bg-slate-800 hover:bg-slate-700 transition cursor-pointer">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
                <input type="range" id="hzoom-slider" min="2" max="32" value="8"
                       oninput="setHorizontalZoom(this.value)"
                       class="w-24 accent-cyan-400 cursor-pointer h-1.5 bg-slate-800 rounded">
                <button type="button" onclick="zoomChart(1)" title="Zoom In" class="w-5 h-5 flex items-center justify-center rounded text-slate-400 hover:text-slate-50 bg-slate-800 hover:bg-slate-700 transition cursor-pointer">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>

            <!-- Zoom Presets -->
            <div class="flex items-center gap-1 border-l border-slate-800 pl-2">
                <button type="button" onclick="setHorizontalZoom(4)" id="btn-hzoom-4" class="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">Dense</button>
                <button type="button" onclick="setHorizontalZoom(8)" id="btn-hzoom-8" class="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-cyan-300 font-semibold border border-cyan-800 transition cursor-pointer">1.0x</button>
                <button type="button" onclick="setHorizontalZoom(16)" id="btn-hzoom-16" class="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">2.0x</button>
                <button type="button" onclick="setHorizontalZoom(26)" id="btn-hzoom-26" class="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">Wide</button>
                <button type="button" onclick="fitChartContent()" title="Fit all bars and center them vertically" class="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">Fit</button>
            </div>
        </div>
    </div>

    <!-- PANEL 2: Traded Volume Card -->
    <div class="bg-darkCard border border-darkBorder rounded-xl p-4 shadow-sm flex flex-col space-y-2">
        <!-- Volume Header & HUD Bar -->
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-darkBorder">
            <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <h3 class="text-sm font-semibold text-slate-100 uppercase tracking-wider">Traded Volume (Lots)</h3>
            </div>

            <!-- Volume HUD -->
            <div class="flex items-center space-x-3 text-xs font-mono bg-slate-900/80 px-2.5 py-1 rounded-lg border border-slate-800">
                <div><span class="text-slate-500">Current Bar Vol:</span> <span id="hud-v" class="text-amber-400 font-bold">—</span></div>
            </div>

        </div>

        <!-- Volume Chart Container -->
        <div id="volume-chart-container" class="w-full h-[120px] rounded-lg overflow-hidden relative bg-darkBg">
        </div>

        <!-- Legend Footer -->
        <div class="flex items-center justify-between text-[11px] text-slate-500 px-1 pt-1 border-t border-slate-800/80">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></span>
                    <span class="text-slate-400">Buy-initiated volume</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-sm bg-rose-500 inline-block"></span>
                    <span class="text-slate-400">Sell-initiated volume</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-slate-400">Download bars</span>
                <a href="/api/export/bars.csv" download class="text-cyan-300 hover:text-cyan-200 underline decoration-cyan-800 underline-offset-2" title="Every bar at this interval, with volume and VWAP, as CSV">CSV</a>
                {% if parquet_available %}<a href="/api/export/bars.parquet" download class="text-cyan-300 hover:text-cyan-200 underline decoration-cyan-800 underline-offset-2" title="The same, as Parquet">Parquet</a>{% endif %}
            </div>
        </div>
    </div>
</div>

<script>
    let priceChart = null;
    let volumeChart = null;
    let candleSeries = null;
    let vwapSeries = null;       // the session's volume-weighted average price
    let volumeSeries = null;     // total volume, drawn in the sell color
    let buyVolumeSeries = null;  // buy-initiated volume, drawn on top
    // Chart colors come from the theme's CSS variables (themeColor in base.html), so the charts
    // follow the theme: applyChartTheme re-applies them when it changes.
    function chartPalette() {
        return {
            background: themeColor('darkBg'),
            text: themeColor('slate-400'),
            grid: themeColor('slate-800', 0.45),
            crosshair: themeColor('sky-400', 0.4),
            label: themeColor('slate-900'),
            border: themeColor('slate-800'),
            up: themeColor('emerald-500'),
            down: themeColor('rose-500'),
            buyVolume: themeColor('emerald-500', 0.85),
            sellVolume: themeColor('rose-500', 0.75),
            vwap: themeColor('amber-500'),
        };
    }
    let currentInterval = 2;
    let latestCandleCache = null;
    let isSyncingRange = false;

    function zoomBothByDelta(deltaY) {
        const pc = document.getElementById('price-chart-container');
        const vc = document.getElementById('volume-chart-container');
        if (!pc || !vc) return;
        const pCanvas = pc.querySelector('canvas');
        const vCanvas = vc.querySelector('canvas');
        if (!pCanvas || !vCanvas) return;

        const pRect = pCanvas.getBoundingClientRect();
        const vRect = vCanvas.getBoundingClientRect();
        const pCenter = pRect.left + pRect.width / 2;
        const vCenter = vRect.left + vRect.width / 2;

        pCanvas.dispatchEvent(new WheelEvent('wheel', {
            deltaY: deltaY,
            clientX: pCenter,
            clientY: pRect.top + pRect.height / 2,
            bubbles: true,
            cancelable: true
        }));
        vCanvas.dispatchEvent(new WheelEvent('wheel', {
            deltaY: deltaY,
            clientX: vCenter,
            clientY: vRect.top + vRect.height / 2,
            bubbles: true,
            cancelable: true
        }));
    }

    function zoomChart(direction) {
        const delta = direction > 0 ? -120 : 120;
        zoomBothByDelta(delta);
        syncZoomControlsFromChart();
    }

    function setHorizontalZoom(targetSpacing) {
        if (!priceChart) return;
        const target = Math.max(2, Math.min(36, parseFloat(targetSpacing)));
        let cur = priceChart.timeScale().options().barSpacing || 6;
        let maxIter = 40;
        while (Math.abs(cur - target) > 0.25 && maxIter-- > 0) {
            const ratio = target / cur;
            let deltaY = (1 - ratio) * 1000;
            deltaY = Math.max(-100, Math.min(100, deltaY));
            zoomBothByDelta(deltaY);
            cur = priceChart.timeScale().options().barSpacing;
        }
        syncZoomControlsFromChart();
    }

    function syncZoomControlsFromChart() {
        if (!priceChart) return;
        const spacing = priceChart.timeScale().options().barSpacing || 6;
        const badge = document.getElementById('hzoom-val-badge');
        const slider = document.getElementById('hzoom-slider');
        const pct = Math.round((spacing / 8) * 100);

        if (badge) badge.textContent = `${pct}% (${spacing.toFixed(1)}px)`;
        if (slider && Math.abs(parseFloat(slider.value) - spacing) > 0.5) {
            slider.value = Math.round(spacing);
        }

        [4, 8, 16, 26].forEach(p => {
            const btn = document.getElementById(`btn-hzoom-${p}`);
            if (btn) {
                if (Math.abs(spacing - p) < 1.5) {
                    btn.className = "px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-cyan-300 font-semibold border border-cyan-800 transition cursor-pointer";
                } else {
                    btn.className = "px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer";
                }
            }
        });
    }

    // Bar times are simulation time since the last reset, so label them as elapsed time.
    function formatElapsed(t) {
        const total = Math.max(0, Math.round(Number(t)));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = String(total % 60).padStart(2, '0');
        return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
    }

    function initDualPanelCharts() {
        const priceContainer = document.getElementById('price-chart-container');
        const volumeContainer = document.getElementById('volume-chart-container');
        if (!priceContainer || !volumeContainer || !window.LightweightCharts) return;

        // Clean any existing chart instances
        if (priceChart) {
            priceChart.remove();
            priceChart = null;
        }
        if (volumeChart) {
            volumeChart.remove();
            volumeChart = null;
        }

        const P = chartPalette();
        const commonLayout = {
            background: { type: 'solid', color: P.background },
            textColor: P.text,
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 11,
        };

        const commonGrid = {
            vertLines: { color: P.grid },
            horzLines: { color: P.grid },
        };

        const commonCrosshair = {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: {
                color: P.crosshair,
                width: 1,
                style: LightweightCharts.LineStyle.Dashed,
                labelBackgroundColor: P.label,
            },
            horzLine: {
                color: P.crosshair,
                width: 1,
                style: LightweightCharts.LineStyle.Dashed,
                labelBackgroundColor: P.label,
            },
        };

        // --- 1. Top Panel: Candlestick Price Chart ---
        const priceHeight = priceContainer.clientHeight || 420;
        priceChart = LightweightCharts.createChart(priceContainer, {
            width: priceContainer.clientWidth,
            height: priceHeight,
            layout: commonLayout,
            grid: commonGrid,
            crosshair: commonCrosshair,
            localization: { timeFormatter: formatElapsed },
            rightPriceScale: {
                borderColor: P.border,
                scaleMargins: {
                    top: 0.1,
                    bottom: 0.1,
                },
            },
            timeScale: {
                borderColor: P.border,
                timeVisible: true,
                secondsVisible: true,
                fixLeftEdge: true,
                rightOffset: 6,
                tickMarkFormatter: (time) => formatElapsed(time),
            },
        });

        candleSeries = priceChart.addCandlestickSeries({
            priceFormat: { type: 'price', precision: 0, minMove: 1 },  // prices are whole ticks
            upColor: P.up,
            downColor: P.down,
            borderDownColor: P.down,
            borderUpColor: P.up,
            wickDownColor: P.down,
            wickUpColor: P.up,
        });

        // The session VWAP: the volume-weighted average price of every trade since the session began.
        vwapSeries = priceChart.addLineSeries({
            color: P.vwap,
            lineWidth: 2,
            priceLineVisible: false,
            lastValueVisible: true,
            crosshairMarkerVisible: false,
            title: 'VWAP',
            priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
        });

        // --- 2. Bottom Panel: Traded Volume Histogram Chart ---
        volumeChart = LightweightCharts.createChart(volumeContainer, {
            width: volumeContainer.clientWidth,
            height: 120,
            layout: commonLayout,
            grid: commonGrid,
            crosshair: commonCrosshair,
            localization: { timeFormatter: formatElapsed },
            rightPriceScale: {
                borderColor: P.border,
                scaleMargins: {
                    top: 0.15,
                    bottom: 0.0,
                },
            },
            timeScale: {
                borderColor: P.border,
                timeVisible: true,
                secondsVisible: true,
                fixLeftEdge: true,
                rightOffset: 6,
                tickMarkFormatter: (time) => formatElapsed(time),
            },
        });

        // Total volume in the sell color with buy volume drawn over it, so the
        // green part of each bar is buy-initiated and the red rest sell-initiated.
        volumeSeries = volumeChart.addHistogramSeries({
            color: P.sellVolume,
            priceFormat: {
                type: 'volume',
            },
        });
        buyVolumeSeries = volumeChart.addHistogramSeries({
            color: P.buyVolume,
            priceFormat: {
                type: 'volume',
            },
        });

        // --- 3. Synchronize Time Scales (Bidirectional Panning & Zooming) ---
        priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            if (isSyncingRange || !range || !volumeChart) return;
            isSyncingRange = true;
            try {
                volumeChart.timeScale().setVisibleLogicalRange(range);
            } catch (e) {}
            isSyncingRange = false;
            syncZoomControlsFromChart();
        });

        volumeChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            if (isSyncingRange || !range || !priceChart) return;
            isSyncingRange = true;
            try {
                priceChart.timeScale().setVisibleLogicalRange(range);
            } catch (e) {}
            isSyncingRange = false;
            syncZoomControlsFromChart();
        });

        // --- 4. Crosshair HUD Inspection ---
        // The volume series live on the other chart, so look bars up by time.
        const showBarAt = (param) => {
            const bar = param && param.time != null ? barCache.get(param.time) : null;
            updateHudDisplay(bar || latestCandleCache);
        };
        priceChart.subscribeCrosshairMove(showBarAt);
        volumeChart.subscribeCrosshairMove(showBarAt);

        // --- 5. Responsive Resize Observer for Both Panels ---
        const resizeObserver = new ResizeObserver(entries => {
            if (!entries || entries.length === 0) return;
            const w = priceContainer.clientWidth;
            const h = priceContainer.clientHeight;
            if (w > 0) {
                if (priceChart) priceChart.applyOptions({ width: w, height: h || 420 });
                if (volumeChart) volumeChart.applyOptions({ width: w });
            }
        });
        resizeObserver.observe(priceContainer);

        // Fetch initial historical candles & connect dedicated SSE stream
        loadChartData();
    }

    function applyChartTheme() {
        if (!priceChart || !volumeChart) return;
        const P = chartPalette();
        const look = {
            layout: { background: { type: 'solid', color: P.background }, textColor: P.text },
            grid: { vertLines: { color: P.grid }, horzLines: { color: P.grid } },
            crosshair: { vertLine: { color: P.crosshair, labelBackgroundColor: P.label },
                         horzLine: { color: P.crosshair, labelBackgroundColor: P.label } },
            rightPriceScale: { borderColor: P.border },
            timeScale: { borderColor: P.border },
        };
        priceChart.applyOptions(look);
        volumeChart.applyOptions(look);
        candleSeries.applyOptions({ upColor: P.up, downColor: P.down, borderUpColor: P.up, borderDownColor: P.down,
                                    wickUpColor: P.up, wickDownColor: P.down });
        vwapSeries.applyOptions({ color: P.vwap });
        volumeSeries.applyOptions({ color: P.sellVolume });
        buyVolumeSeries.applyOptions({ color: P.buyVolume });
        document.dispatchEvent(new CustomEvent('lob:chart-theme'));
    }
    document.addEventListener('lob:theme', applyChartTheme);

    function updateHudDisplay(candle) {
        if (!candle) return;
        const oEl = document.getElementById('hud-o');
        const hEl = document.getElementById('hud-h');
        const lEl = document.getElementById('hud-l');
        const cEl = document.getElementById('hud-c');
        const vEl = document.getElementById('hud-v');
        const vwapEl = document.getElementById('hud-vwap');
        if (vwapEl) vwapEl.textContent = candle.vwap != null ? Number(candle.vwap).toFixed(2) : '—';

        const fmt = (v) => (Number.isInteger(Number(v)) ? String(Number(v)) : Number(v).toFixed(2));
        if (oEl) oEl.textContent = fmt(candle.open);
        if (hEl) hEl.textContent = fmt(candle.high);
        if (lEl) lEl.textContent = fmt(candle.low);
        if (cEl) {
            cEl.textContent = fmt(candle.close);
            cEl.className = candle.close >= candle.open
                ? "text-emerald-400 font-bold font-mono"
                : "text-rose-400 font-bold font-mono";
        }
        if (vEl) {
            const volume = candle.volume != null ? candle.volume : 0;
            vEl.textContent = candle.buy_volume != null
                ? `${volume} (buy ${candle.buy_volume} / sell ${candle.sell_volume})`
                : `${volume}`;
        }
    }

    // Bars by time, for the crosshair readout.
    const barCache = new Map();

    function applyBar(c) {
        candleSeries.update(c);
        if (c.vwap != null) vwapSeries.update({ time: c.time, value: c.vwap });
        volumeSeries.update({ time: c.time, value: c.volume });
        buyVolumeSeries.update({ time: c.time, value: c.buy_volume });
        barCache.set(c.time, c);
    }

    function loadChartData() {
        const loader = document.getElementById('chart-loading');
        if (loader) loader.classList.remove('hidden');

        fetch('/api/candlesticks')
            .then(res => res.json())
            .then(data => {
                if (!candleSeries || !volumeSeries || !buyVolumeSeries) return;

                const candles = data.candles || [];
                candleSeries.setData(candles);
                vwapSeries.setData(candles.filter(c => c.vwap != null).map(c => ({ time: c.time, value: c.vwap })));
                volumeSeries.setData(candles.map(c => ({ time: c.time, value: c.volume })));
                buyVolumeSeries.setData(candles.map(c => ({ time: c.time, value: c.buy_volume })));
                barCache.clear();
                candles.forEach(c => barCache.set(c.time, c));

                if (candles.length > 0) {
                    latestCandleCache = candles[candles.length - 1];
                    updateHudDisplay(latestCandleCache);
                    // Show the newest bars at the current zoom instead of fitting the whole
                    // history: a fresh session has only a bar or two, and fitting them would
                    // stretch each one across the chart.
                    const slider = document.getElementById('hzoom-slider');
                    const spacing = slider ? parseFloat(slider.value) : 8;
                    [priceChart, volumeChart].forEach(chart => {
                        if (!chart) return;
                        chart.timeScale().applyOptions({ barSpacing: spacing });
                        chart.timeScale().scrollToRealTime();
                    });
                    setTimeout(syncZoomControlsFromChart, 50);
                }

                currentInterval = data.interval || 2;
                updateIntervalButtons(currentInterval);

                if (loader) loader.classList.add('hidden');
            })
            .catch(err => {
                console.error("Failed to load candlesticks:", err);
                if (loader) loader.classList.add('hidden');
            });
    }

    const MAX_FIT_BAR_SPACING = 32;  // the zoom slider's maximum

    function fitChartContent() {
        [priceChart, volumeChart].forEach(chart => {
            if (!chart) return;
            chart.timeScale().fitContent();
            // Vertically, return to auto-scaling: it fits the visible bars with equal margins
            // above and below, centering them. Dragging a price axis switches it off.
            chart.priceScale('right').applyOptions({ autoScale: true });
        });
        setTimeout(() => {
            // Fitting a short history would otherwise stretch each bar across the chart.
            [priceChart, volumeChart].forEach(chart => {
                if (chart && chart.timeScale().options().barSpacing > MAX_FIT_BAR_SPACING) {
                    chart.timeScale().applyOptions({ barSpacing: MAX_FIT_BAR_SPACING });
                    chart.timeScale().scrollToRealTime();
                }
            });
            syncZoomControlsFromChart();
        }, 50);
    }

    function setChartInterval(interval) {
        currentInterval = interval;
        updateIntervalButtons(interval);

        const formData = new FormData();
        formData.append('interval', interval);

        fetch('/api/chart/interval', {
            method: 'POST',
            body: formData,
        }).then(() => {
            loadChartData();
        });
    }

    function updateIntervalButtons(interval) {
        const intervals = [1, 2, 5, 10, 15, 30, 60, 180, 300];
        intervals.forEach(i => {
            const btn = document.getElementById(`btn-interval-${i}`);
            if (btn) {
                if (Number(i) === Number(interval)) {
                    btn.className = "px-2 py-0.5 rounded text-[11px] font-mono transition text-cyan-300 font-semibold bg-slate-800 border border-cyan-800 shadow-sm cursor-pointer";
                } else {
                    btn.className = "px-2 py-0.5 rounded text-[11px] font-mono transition text-slate-400 hover:text-slate-50 bg-slate-900 border border-transparent cursor-pointer";
                }
            }
        });
    }

    // Live data arrives on the page's event stream (see index.html).
    // Every bar since the last push: the last one sent may have changed, and
    // fast simulations can complete several bars between pushes.
    document.addEventListener('lob:candles', function(evt) {
        try {
            const bars = evt.detail;
            if (!candleSeries || !volumeSeries || !buyVolumeSeries || !bars.length) return;
            bars.forEach(applyBar);
            latestCandleCache = bars[bars.length - 1];
            updateHudDisplay(latestCandleCache);

            // Auto-follow realtime edge on both charts
            if (priceChart) priceChart.timeScale().scrollToRealTime();
            if (volumeChart) volumeChart.timeScale().scrollToRealTime();
        } catch(e) {
            console.error("Error updating candles:", e);
        }
    });

    document.addEventListener('lob:chart-reset', loadChartData);

    // Bars produced while the stream was down were never pushed, so reload them on every reconnect.
    let connectedBefore = false;
    document.addEventListener('lob:connection', function(evt) {
        const live = evt.detail === 'live';
        const pulse = document.getElementById('chart-pulse');
        if (pulse) {
            pulse.classList.toggle('bg-emerald-400', live);
            pulse.classList.toggle('bg-amber-400', !live);
        }
        if (live) {
            if (connectedBefore) loadChartData();
            connectedBefore = true;
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        initDualPanelCharts();
    });
</script>
