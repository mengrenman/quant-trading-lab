<!-- Recent Trades Component (Time & Sales) -->
<div id="trades-container" class="flex flex-col h-full bg-darkCard border border-darkBorder rounded-xl p-4 shadow-sm">
    <div class="flex items-center justify-between pb-3 border-b border-darkBorder mb-2">
        <h2 class="text-sm font-semibold text-slate-100 uppercase tracking-wider flex items-center gap-2">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            Recent Trades (Fills)
        </h2>
        <span class="text-xs text-slate-400 font-mono">{{ trades|length }} fills</span>
    </div>

    <!-- Table Header -->
    <div class="grid grid-cols-4 text-xs font-semibold text-slate-400 px-3 py-1.5 bg-slate-900/60 rounded-lg mb-1">
        <div title="The side of the order that took liquidity">Aggressor</div>
        <div class="text-right">Price</div>
        <div class="text-right">Size</div>
        <div class="text-right">Time</div>
    </div>

    <!-- Trades List -->
    <div class="flex-1 overflow-y-auto space-y-0.5 text-xs font-mono pr-1 max-h-56">
        {% if trades %}
            {% for t in trades %}
                <div class="grid grid-cols-4 px-3 py-1.5 rounded hover:bg-slate-800/60 transition-colors border-b border-slate-900/50">
                    <div>
                        <span title="{% if t.side == 'bid' %}Buyer-initiated: a buy order hit the ask{% else %}Seller-initiated: a sell order hit the bid{% endif %}"
                              class="px-1.5 py-0.5 rounded text-[10px] font-sans font-semibold {% if t.side == 'bid' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30{% else %}bg-rose-500/20 text-rose-400 border border-rose-500/30{% endif %}">
                            {% if t.side == 'bid' %}BUY{% else %}SELL{% endif %}
                        </span>
                    </div>
                    <div class="text-right font-bold {% if t.side == 'bid' %}text-emerald-400{% else %}text-rose-400{% endif %}">
                        {{ t.price }}
                    </div>
                    <div class="text-right text-slate-200">
                        {{ t.size }}
                    </div>
                    <div class="text-right text-slate-500 text-[11px]">
                        {{ "%.2f"|format(t.timestamp) }}s
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="text-center py-6 text-slate-500 italic">No executions yet</div>
        {% endif %}
    </div>
</div>
