<!-- Simulation status badge: running state, event count and simulation time (re-rendered over SSE) -->
<div id="sim-stats-badge" class="flex items-center gap-3 text-slate-400 font-mono text-[11px] bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800">
    {% if is_running %}
    <button type="button" onclick="togglePlayback()" id="sim-status-toggle-pill" title="Click to pause simulation"
            class="cursor-pointer transition hover:opacity-80 flex items-center gap-1.5 text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> RUNNING
    </button>
    {% else %}
    <button type="button" onclick="togglePlayback()" id="sim-status-toggle-pill" title="Click to start simulation"
            class="cursor-pointer transition hover:opacity-80 flex items-center gap-1.5 text-[10px] font-semibold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> PAUSED
    </button>
    {% endif %}
    <div>Events: <span class="text-slate-200 font-bold">{{ event_count }}</span></div>
    <div>Sim Time: <span class="text-slate-200 font-bold">{{ "%.2f"|format(sim_time) }}s</span></div>
</div>
