<!-- Simulation status: running state, event count and simulation time (re-rendered over SSE) -->
<div id="sim-stats-badge" data-running="{{ 'true' if is_running else 'false' }}" class="flex items-center gap-3 text-slate-400 font-mono text-[11px] bg-slate-900/80 px-3 py-2 rounded-lg border border-slate-800">
    {% if is_running %}
    <span id="sim-state-label" class="flex items-center gap-1.5 font-semibold text-emerald-400"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Running</span>
    {% else %}
    <span id="sim-state-label" class="flex items-center gap-1.5 font-semibold text-amber-400"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Paused</span>
    {% endif %}
    <span>Events <span class="text-slate-200 font-bold">{{ event_count }}</span></span>
    <span title="Simulation clock">Time <span class="text-slate-200 font-bold">{{ "%.2f"|format(sim_time) }}s</span></span>
</div>
