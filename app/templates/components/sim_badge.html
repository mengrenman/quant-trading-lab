<!-- Simulation status: running state, event count and simulation time (re-rendered over SSE), and whether it is
     recording or playing back (its data attributes drive the Record button and the playback bar: lob-recordings.js) -->
<div id="sim-stats-badge" data-running="{{ 'true' if is_running else 'false' }}"
     data-recording="{{ 'true' if recording else 'false' }}" data-recorded="{{ recording.events if recording else 0 }}"
     data-playback="{{ 'true' if playback else 'false' }}" data-fitting="{{ (fitting[0] ~ '/' ~ fitting[1]) if fitting else '' }}"
     {%- if playback %} data-pb-id="{{ playback.id }}" data-pb-name="{{ playback.name }}" data-pb-start="{{ playback.start }}"
     data-pb-end="{{ playback.end }}" data-pb-time="{{ playback.time }}" data-pb-cursor="{{ playback.cursor }}"
     data-pb-events="{{ playback.events }}" data-pb-ended="{{ 'true' if playback.ended else 'false' }}"
     data-pb-recorded-with="{{ playback.recorded_with }}" data-pb-takes-over="{{ playback.takes_over }}"
     data-pb-seeking="{{ (playback.seeking[0] ~ '/' ~ playback.seeking[1]) if playback.seeking else '' }}"{% endif %}
     class="flex items-center gap-3 text-slate-400 font-mono text-[0.6875rem] bg-slate-900/80 px-3 py-2 rounded-lg border border-slate-800">
    {% if is_running %}
    <span id="sim-state-label" class="flex items-center gap-1.5 font-semibold text-emerald-400"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Running</span>
    {% else %}
    <span id="sim-state-label" class="flex items-center gap-1.5 font-semibold text-amber-400"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Paused</span>
    {% endif %}
    <span>Events <span class="text-slate-200 font-bold">{{ event_count }}</span></span>
    <span title="Simulation clock">Time <span class="text-slate-200 font-bold">{{ "%.2f"|format(sim_time) }}s</span></span>
    {% if recording %}
    <span class="flex items-center gap-1.5 font-semibold text-rose-400" title="Recording since {{ '%.2f'|format(recording.since) }}: {{ '{:,}'.format(recording.events) }} events so far"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>REC {{ "{:,}".format(recording.events) }}</span>
    {% endif %}
    {% if playback %}
    <span class="flex items-center gap-1.5 font-semibold text-violet-300" title="Playing back {{ playback.name }}"><span class="w-1.5 h-1.5 rounded-full bg-violet-400"></span>Playback</span>
    {% endif %}
</div>
