<!DOCTYPE html>
<html lang="en" class="dark" data-theme="midnight" data-text="small">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Order Book Simulator | Gould et al. (2013)</title>
    <link rel="icon" type="image/svg+xml" href="{{ asset('favicon.svg') }}">
    <!-- Everything is served locally (the page works offline). app.css is built from the templates by
         `make css` (Tailwind CSS v3); fonts.css serves Inter and JetBrains Mono from app/static/fonts. -->
    <script>
        // Apply the saved theme and text size before the page paints, so it never flashes the default.
        (function () {
            try {
                const theme = localStorage.getItem('lob-theme');
                if (['midnight', 'daylight', 'terminal'].includes(theme)) document.documentElement.dataset.theme = theme;
                if (localStorage.getItem('lob-palette') === 'colorblind') document.documentElement.dataset.palette = 'colorblind';
                const size = localStorage.getItem('lob-text');
                if (['small', 'medium', 'large'].includes(size)) document.documentElement.dataset.text = size;
            } catch (e) { /* storage unavailable: keep the default */ }
        })();
    </script>
    <link rel="stylesheet" href="{{ asset('css/fonts.css') }}">
    <link rel="stylesheet" href="{{ asset('css/themes.css') }}">
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">
    <!-- HTMX (forms and buttons); live updates come from the page's event stream -->
    <script src="{{ asset('js/htmx.min.js') }}"></script>
    <!-- Lightweight Charts (Financial Candlestick Library) -->
    <script src="{{ asset('js/lightweight-charts.standalone.production.js') }}"></script>
</head>
<body class="bg-darkBg text-slate-200 min-h-screen font-sans flex flex-col antialiased">
    <!-- Top Navbar -->
    <header class="border-b border-darkBorder bg-darkCard/80 backdrop-blur sticky top-0 z-50 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
        <div class="flex items-center gap-3 min-w-0">
            <div class="h-8 w-8 flex-shrink-0 rounded-lg bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-bold text-darkBg shadow-lg shadow-emerald-500/20">
                LOB
            </div>
            <div class="min-w-0">
                <h1 class="text-sm sm:text-base font-semibold text-slate-50 tracking-tight flex flex-wrap items-center gap-x-2 gap-y-0.5">
                    Limit Order Book Interactive Engine
                    <span class="hidden sm:inline text-xs px-2 py-0.5 rounded-full bg-cyan-950/80 text-cyan-400 border border-cyan-800 font-mono">Gould et al. (2013)</span>
                </h1>
                <p class="hidden sm:block text-xs text-slate-400">Run an order-flow model, watch the book form, and trade against it</p>
            </div>
        </div>

        <!-- The page's own navigation (the Trade, Analyze and Learn views of index.html) -->
        {% block nav %}{% endblock %}

        <div class="flex items-center gap-4 flex-shrink-0">
            <!-- Text size, color theme and color-blind-safe buy/sell colors (saved in this browser) -->
            <div class="hidden md:flex items-center gap-2 text-xs">
                <label class="flex items-center gap-1.5 text-slate-400" for="text-select">Text
                    <select id="text-select" onchange="setTextSize(this.value)" title="Size of the text, and with it of everything on the page"
                            class="bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5 text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                </label>
                <label class="flex items-center gap-1.5 text-slate-400" for="theme-select">Theme
                    <select id="theme-select" onchange="setTheme(this.value)"
                            class="bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5 text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <option value="midnight">Midnight</option>
                        <option value="daylight">Daylight</option>
                        <option value="terminal">Terminal</option>
                    </select>
                </label>
                <button id="palette-toggle" type="button" aria-pressed="false" onclick="toggleColorblind()"
                        title="Show buying in blue and selling in orange instead of green and red"
                        class="px-2 py-0.5 rounded border border-slate-800 bg-slate-900 text-slate-300 hover:text-slate-100 aria-pressed:border-cyan-500 aria-pressed:text-cyan-300 transition cursor-pointer">
                    Color-blind safe
                </button>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span id="connection-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                <span class="text-slate-300 font-mono" id="connection-status">Connecting…</span>
            </div>
            <a href="https://arxiv.org/abs/1012.0349" target="_blank" rel="noopener"
               title="Gould, Porter, Williams, McDonald, Fenn and Howison (2013), Limit order books, Quantitative Finance 13(11)"
               class="hidden sm:inline text-xs text-slate-400 hover:text-slate-50 transition">The paper &rarr;</a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-5 overflow-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Application Helper Scripts -->
    <script>
        // A theme color as CSS: themeColor('emerald-500') or themeColor('slate-800', 0.45). Colors are
        // "R G B" variables set per theme (app/static/css/themes.css).
        window.themeColor = function (name, alpha = 1) {
            const rgb = getComputedStyle(document.documentElement).getPropertyValue(`--c-${name}`).trim().split(/\s+/).join(', ');
            return alpha === 1 ? `rgb(${rgb})` : `rgba(${rgb}, ${alpha})`;
        };

        function themeChanged() {
            const root = document.documentElement;
            const select = document.getElementById('theme-select');
            if (select) select.value = root.dataset.theme;
            const toggle = document.getElementById('palette-toggle');
            if (toggle) toggle.setAttribute('aria-pressed', root.dataset.palette === 'colorblind' ? 'true' : 'false');
            document.dispatchEvent(new CustomEvent('lob:theme'));
        }

        window.setTheme = function (theme) {
            document.documentElement.dataset.theme = theme;
            try { localStorage.setItem('lob-theme', theme); } catch (e) { /* not saved */ }
            themeChanged();
        };

        window.toggleColorblind = function () {
            const root = document.documentElement;
            if (root.dataset.palette === 'colorblind') delete root.dataset.palette;
            else root.dataset.palette = 'colorblind';
            try { localStorage.setItem('lob-palette', root.dataset.palette || 'standard'); } catch (e) { /* not saved */ }
            themeChanged();
        };

        document.addEventListener('DOMContentLoaded', themeChanged);

        // Text size: every size on the page is in rem, so the root font size scales it all
        // (app/static/css/tailwind.input.css); the charts follow on 'lob:text-size'.
        window.setTextSize = function (size) {
            document.documentElement.dataset.text = size;
            try { localStorage.setItem('lob-text', size); } catch (e) { /* not saved */ }
            textSizeChanged();
        };

        function textSizeChanged() {
            const select = document.getElementById('text-select');
            if (select) select.value = document.documentElement.dataset.text;
            document.dispatchEvent(new CustomEvent('lob:text-size'));
        }

        document.addEventListener('DOMContentLoaded', textSizeChanged);

        function setOrderPrice(price) {
            const input = document.getElementById('order-price');
            if (input) {
                input.value = price;
                input.classList.add('ring-2', 'ring-cyan-400');
                setTimeout(() => input.classList.remove('ring-2', 'ring-cyan-400'), 500);
            }
        }

        window.simIsRunning = false;

        window.updatePlaybackUI = function(running) {
            window.simIsRunning = running;
            const btn = document.getElementById('sim-play-btn');
            const icon = document.getElementById('sim-play-icon');
            const text = document.getElementById('sim-play-text');
            const pill = document.getElementById('sim-state-label');

            if (btn && icon && text) {
                if (running) {
                    btn.className = "flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider transition cursor-pointer shadow-lg bg-amber-500 hover:bg-amber-600 text-slate-950 shadow-amber-500/20";
                    icon.innerHTML = '<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                    text.textContent = 'Pause Sim';
                } else {
                    btn.className = "flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider transition cursor-pointer shadow-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 shadow-emerald-500/20";
                    icon.innerHTML = '<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                    text.textContent = 'Start Sim';
                }
            }

            if (pill) {  // the state label in the status badge (components/sim_badge.html)
                pill.className = running
                    ? "flex items-center gap-1.5 font-semibold text-emerald-400"
                    : "flex items-center gap-1.5 font-semibold text-amber-400";
                pill.innerHTML = running
                    ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Running'
                    : '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Paused';
            }
        };

        window.togglePlayback = function() {
            if (window.simIsRunning) {
                window.pauseSim();
            } else {
                window.startSim();
            }
        };
        window.toggleSimPlayback = window.togglePlayback;

        window.startSim = function() {
            window.updatePlaybackUI(true);
            const form = new FormData();
            form.append('action', 'play');
            fetch('/api/sim/control', {
                method: 'POST',
                body: form
            }).then(res => res.text()).then(html => {
                const isRunning = html.includes('Pause Sim');
                window.updatePlaybackUI(isRunning);
            }).catch(err => {
                console.error("Failed to start sim:", err);
                window.updatePlaybackUI(false);
            });
        };

        window.pauseSim = function() {
            window.updatePlaybackUI(false);
            const form = new FormData();
            form.append('action', 'pause');
            fetch('/api/sim/control', {
                method: 'POST',
                body: form
            }).then(res => res.text()).then(html => {
                const isRunning = html.includes('Pause Sim');
                window.updatePlaybackUI(isRunning);
            }).catch(err => {
                console.error("Failed to pause sim:", err);
                window.updatePlaybackUI(true);
            });
        };

        window.stepSim = function(n) {
            const form = new FormData();
            form.append('action', 'step');
            form.append('n', n);
            fetch('/api/sim/control', {
                method: 'POST',
                body: form
            });
        };

        window.handleSimReset = function() {
            window.updatePlaybackUI(false);
            const form = new FormData();
            form.append('action', 'reset');
            fetch('/api/sim/control', {
                method: 'POST',
                body: form
            });
        };

        window.updateSimSpeed = function(val) {
            const intVal = Math.max(1, Math.min(2000, parseInt(val, 10) || 1));
            if (window.showSpeed) window.showSpeed(intVal);
            const form = new FormData();
            form.append('speed', intVal);
            fetch('/api/sim/config', {
                method: 'POST',
                body: form
            });
        };

        window.centerDomAtMid = function() {
            const scrollArea = document.getElementById('dom-scroll-area');
            const midBanner = document.getElementById('dom-mid-banner');
            if (scrollArea && midBanner) {
                // Using offsetTop calculation relative to scroll container
                const targetScroll = midBanner.offsetTop - (scrollArea.clientHeight / 2) + (midBanner.offsetHeight / 2);
                scrollArea.scrollTop = targetScroll;
            }
        };

        // Show validation messages from the parameter form (returned with status 422),
        // and say why an order was not accepted.
        document.addEventListener('htmx:beforeSwap', function(e) {
            const target = e.detail.target;
            const status = e.detail.xhr.status;
            if (status === 422 && target && target.id === 'model-params') {
                e.detail.shouldSwap = true;
                e.detail.isError = false;
            } else if (status >= 400 && target && target.id === 'order-result') {
                const reason = status === 422
                    ? 'Order rejected: price and size must be whole numbers of at least 1.'
                    : `Order failed: the server answered with status ${status}.`;
                e.detail.serverResponse = `<span class="text-rose-400">${reason}</span>`;
                e.detail.shouldSwap = true;
                e.detail.isError = false;
            }
        });

        // Keyboard shortcuts: Space starts or pauses, the right arrow steps one event (ten with
        // Shift), F fits the chart, 1 to 3 show the Trade, Analyze and Learn views. They are off
        // while typing in a field, and Space on a focused button or link keeps its usual meaning.
        document.addEventListener('keydown', function(e) {
            if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
            const el = document.activeElement;
            const tag = el ? el.tagName : '';
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (el && el.isContentEditable)) return;
            if (e.key === ' ') {
                if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return;
                e.preventDefault();  // no page scroll
                window.togglePlayback();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                window.stepSim(e.shiftKey ? 10 : 1);
            } else if ((e.key === 'f' || e.key === 'F') && typeof window.fitChartContent === 'function') {
                window.fitChartContent();
            } else if (['1', '2', '3'].includes(e.key) && typeof window.showView === 'function') {
                window.showView(['trade', 'analyze', 'learn'][Number(e.key) - 1]);
            }
        });

        window.addEventListener('load', function() {
            setTimeout(window.centerDomAtMid, 100);
        });
    </script>
</body>
</html>
