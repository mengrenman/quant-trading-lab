[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lob"
version = "0.2.0"
description = "Limit order book simulation for teaching, after Gould et al. (2013)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",  # cointegration tests: lob.statarb's traders, notebooks 10 and 12
    "sortedcontainers>=2.4",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
notebooks = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "joblib>=1.3",
]
parquet = [
    "pyarrow>=14",  # Parquet downloads from the dashboard (CSV needs nothing extra)
]
dev = [
    "lob[web,notebooks,parquet]",
    "pytest>=7.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytailwindcss>=0.2",  # builds app/static/css/app.css (make css); fetches Tailwind v3.4.17 on first use
    "playwright>=1.40",    # browser tests (make test-browser), using the installed Chrome
]

[tool.setuptools.packages.find]
include = ["lob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives the dashboard in Chrome; run with make test-browser"]
addopts = ["-m", "not browser"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put the repo on sys.path before importing lob.
"notebooks/*.ipynb" = ["E402"]
